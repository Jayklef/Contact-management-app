{% extends 'base.html' %} {% include 'nav.html' %} {% block title %} Home
{%endblock title %} {% block body %}
<div class="container">
  <div class="row">
    <div class="col md-12">
      <div class="jumbotron p-3">
        <h2>
          Manage Contacts<button
            type="button"
            class="btn btn-success"
            data-toggle="modal"
            data-target="#mymodal"
          >
            Add New Contact
          </button>
        </h2>

        <table class="table table-hover table-dark">
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email ID</th>
            <th>PhoneNumber</th>
            <th>Action</th>
          </tr>
          <tr>
            <td>01</td>
            <td>James Brown</td>
            <td>james@doe.com</td>
            <td>689374945759584</td>
            <td>
              <a
                href="#"
                class="btn btn-warning btn-xs"
                data-toggle="modal"
                data-target="#modaledit01"
                >Edit</a
              >
              <a
                href=""
                class="btn btn-danger btn-xs"
                onclick="return confirm('Are you sure to Delete?')"
                >Delete</a
              >
            </td>
          </tr>
        </table>

        <!-- Add Contact Modal -->
        <div class="modal fade" id="mymodal" tabindex="-1" role="dialog">
          <div class="modal-dialog" role="document">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title">Add New Contact</h5>
                
              </div>

              <form action="{{url_for('addContact')}}" method="POST">
                <div class="modal-body">
                  <div class="form-group">
                    <label>Name</label>
                    <input
                      type="text"
                      name="name"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label>Email</label>
                    <input
                      type="email"
                      name="email"
                      class="form-control"
                      required
                    />
                  </div>

                  <div class="form-group">
                    <label>Phone</label>
                    <input
                      type="text"
                      name="phone"
                      class="form-control"
                      required
                    />
                  </div>
                </div>

                <div class="modal-footer">
                  <button type="submit" class="btn btn-success">Save</button>
                  <button
                    type="button"
                    class="btn btn-secondary"
                    data-dismiss="modal"
                  >
                    Close
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

<!-- Edit Modal -->
<div class="modal fade" id="modaledit01" tabindex="-1" role="dialog">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
  
        <div class="modal-header">
          <h5 class="modal-title">Edit Contact</h5>
         
        </div>
  
        <form action="#" method="POST">
          <div class="modal-body">
  
            <div class="form-group">
              <label>Name</label>
              <input type="text" name="name" class="form-control" value="James Brown">
            </div>
  
            <div class="form-group">
              <label>Email</label>
              <input type="email" name="email" class="form-control" value="james@doe.com">
            </div>
  
            <div class="form-group">
              <label>Phone</label>
              <input type="text" name="phone" class="form-control" value="689374945759584">
            </div>
  
          </div>
  
          <div class="modal-footer">
            <button type="submit" class="btn btn-warning">Update</button>
            <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          </div>
        </form>
  
      </div>
    </div>
  </div>

      </div>
    </div>
  </div>
</div>
{% endblock body %}
